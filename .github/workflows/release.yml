name: Release APK

# Push a tag like v1.2.0 to build the APK and publish it as a GitHub release.
# "Run workflow" on the Actions tab builds it without publishing (the APK is attached to the run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.7"
          channel: stable
          cache: true

      # The release build is signed with the debug key (see android/app/build.gradle.kts).
      # Restoring the same debug.keystore as on the dev machine keeps the signature identical,
      # so the APK installs over the existing app and keeps its data. Without the secret, the
      # runner generates a fresh key and the APK has to replace (uninstall) the existing app.
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set; the APK is signed with a throwaway key."
          fi

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            flutter build apk --release --build-name "${GITHUB_REF_NAME#v}" --build-number "$GITHUB_RUN_NUMBER"
          else
            flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"
          fi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/audio-cutter-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: audio-cutter-apk
          path: dist/*.apk

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
